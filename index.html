<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0}</style></head><body><title>Langkah Barakah</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Lilita+One&display=swap">
<style>
/* Langkah Barakah: kertas krem, garis cokelat tebal, ungu-kuning-oranye dari acuan desain. Papan 7x7 dengan 24 petak di tepi. */
:root{--bg:#FFF3D6;--cd:#FFFBF0;--tx:#3A1F12;--mu:#7C5B47;--bd:#E4CB9E;--sf:#FCE9BC;--ink:#4A230F;--cream:#FFF8E6;--yel:#FFD93B;--org:#F28C28;--mat:#38AA66;
--pos:#2E9E57;--neg:#D93A3A;--qz:#2F6FD6;--wl:#7B3FA0;
--f-d:'Lilita One','Baloo 2',system-ui,sans-serif;--f-b:'Baloo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#241230;--cd:#341A40;--tx:#FFF1DA;--mu:#D0B6D8;--bd:#5A3770;--sf:#2D1739;--wl:#8E44B8;--pos:#2FA866;--neg:#D6454A;--qz:#3F7BE0}}
:root[data-theme=dark]{color-scheme:dark;--bg:#241230;--cd:#341A40;--tx:#FFF1DA;--mu:#D0B6D8;--bd:#5A3770;--sf:#2D1739;--wl:#8E44B8;--pos:#2FA866;--neg:#D6454A;--qz:#3F7BE0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--f-b)}
.w{max-width:1000px;margin:0 auto;padding:14px}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer;background:var(--cd);border:2px solid var(--bd);border-radius:12px;padding:9px 12px}
button:disabled{cursor:not-allowed;opacity:.5}
input,select,textarea{background:var(--cd);border:2px solid var(--bd);border-radius:10px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:64px;resize:vertical}
h1{font-size:1.25rem;margin:0}h2{margin:.2rem 0 .5rem;font-size:1.2rem}h3{margin:1.6rem 0 .6rem;font-size:1.05rem}
.mu{color:var(--mu);font-size:.9rem}.sm{font-size:.82rem}
.up{color:var(--pos);font-weight:700}.dn{color:var(--neg);font-weight:700}
.load{padding:60px 0;text-align:center;color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ttl{font-weight:800;font-size:1.05rem}
.role{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--sf);border:1px solid var(--bd);white-space:nowrap}.role.adm{background:var(--wl);color:#fff;border-color:var(--wl)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.tabs button{flex:0 0 auto;font-weight:700;border-radius:99px;padding:8px 16px}
.tabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.nav3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}
.nav3 button{font-weight:700;padding:14px 6px;color:#fff;border:0;opacity:.55;line-height:1.2}.nav3 button.on{opacity:1;outline:3px solid var(--tx);outline-offset:2px}
.nav3.sm button{padding:10px 4px;font-size:.85rem}
.nav3.n4{grid-template-columns:repeat(4,1fr)}.nav3 .wl{background:var(--wl)}
.tb{display:flex;gap:8px;flex-wrap:wrap}.tb button{font-weight:700}
.rule{margin:6px 0;padding:8px 10px;border-left:4px solid var(--wl);background:color-mix(in srgb,var(--wl) 10%,var(--cd));border-radius:6px;font-size:.88rem}
.op.off,.op.off:disabled{opacity:.5}.ln.off{opacity:.55;cursor:not-allowed}.fac.vc{border-color:var(--wl)}.mkc .acts{margin-top:8px}.mkc .acts button{flex:1 1 100px;padding:8px 10px}
.pos{--c:var(--pos)}.neg{--c:var(--neg)}.qz{--c:var(--qz)}.wl{--c:var(--wl)}
.nav3 .pos{background:var(--pos)}.nav3 .neg{background:var(--neg)}.nav3 .qz{background:var(--qz)}
.hd{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.rnd{background:var(--c);color:#fff;border:0;font-weight:700}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.nb{height:56px;font-weight:700;font-size:1.1rem;border-color:var(--c);color:var(--c)}.nb:hover:not(.used):not(:disabled){background:var(--c);color:#fff}
.nb.used{opacity:.4;background:var(--bd);color:var(--mu);border-color:var(--bd);text-decoration:line-through}.nb.used:hover:not(:disabled){opacity:.75;border-style:dashed;border-color:var(--c)}
.nb:disabled{cursor:default}
.turn{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--cd);border:2px solid var(--bd);border-radius:14px}
.order,.tsel{display:flex;gap:6px;flex-wrap:wrap}.tsel{margin-bottom:12px}
.chip{display:inline-block;padding:5px 11px;border-radius:99px;border:2px solid var(--bd);background:var(--cd);font-size:.88rem;font-weight:600}
.chip.on{border-color:var(--wl);background:color-mix(in srgb,var(--wl) 16%,var(--cd))}.chip em{font-style:normal;color:var(--neg);font-size:.78rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));z-index:10}
.cd{background:var(--cd);border-radius:16px;border-top:8px solid var(--c);padding:18px;max-width:560px;width:100%;max-height:100%;overflow:auto}
.qd{--c:var(--wl);z-index:30}.qd .cd{max-width:420px}.qm{margin:4px 0 14px;font-size:1.05rem}.qb{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qb .cl{margin:0}
.tg{font-size:.8rem;font-weight:700;color:var(--c)}
.big{font-size:1.4rem;font-weight:800;color:var(--c)}.big2{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}.big2 small{font-size:.8rem;font-weight:600;color:var(--mu)}
.op{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;line-height:1.4}
button.op:hover:not(:disabled){border-color:var(--c)}.op.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--cd))}.op:disabled{opacity:1;cursor:default}
.ok{border-color:var(--pos)!important;background:color-mix(in srgb,var(--pos) 18%,var(--cd))}.no{border-color:var(--neg)!important;background:color-mix(in srgb,var(--neg) 18%,var(--cd))}
.cl{background:var(--c);color:#fff;border:0;font-weight:700;width:100%;margin-top:10px}
.ghost{background:transparent;border:0;color:var(--mu);width:100%;margin-top:4px;font-size:.9rem}
.rs{margin-top:24px;text-align:center}.rs button{font-size:.85rem;color:var(--mu)}li{margin:4px 0}
.ln{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:10px 12px;border:2px solid var(--bd);border-radius:12px;cursor:pointer}
.ln input{margin-top:4px;width:18px;height:18px;flex:0 0 auto}.ln.on{border-color:var(--c)}
.fx{margin-top:14px;padding:14px;border-radius:12px;background:var(--sf);border:1px solid var(--bd)}.fx h4{margin:0 0 8px;font-size:.95rem}
.fr{display:grid;grid-template-columns:1fr minmax(150px,200px);gap:4px 10px;align-items:center;margin:10px 0}.fr>.mu{grid-column:1/-1;font-size:.8rem;margin-top:-2px}
.fr select,.fr input:not(.money){width:100%}
.mw{display:flex;align-items:center;border:2px solid var(--bd);border-radius:10px;background:var(--cd);overflow:hidden}
.mw:focus-within{border-color:var(--wl)}
.mw .rpx{padding:0 4px 0 10px;color:var(--mu);font-size:.9rem}
.mw input{border:0;border-radius:0;width:100%;min-width:0;text-align:right;padding:8px 10px 8px 4px;font-variant-numeric:tabular-nums;background:transparent}
.mw input:focus{outline:none}
.sgn{border:0;border-right:1px solid var(--bd);border-radius:0;padding:8px 12px;font-weight:800;color:var(--pos);background:color-mix(in srgb,var(--pos) 12%,var(--cd))}
.sgn.neg{color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,var(--cd))}
input.qty{text-align:right;width:100%;font-variant-numeric:tabular-nums}
.tg2{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:.92rem}.tg2 input{margin-top:4px}
.autos{margin:10px 0;padding:8px 12px;border-left:4px solid var(--wl);background:color-mix(in srgb,var(--wl) 10%,var(--cd));border-radius:6px;font-size:.9rem}.autos ul{margin:4px 0 0;padding-left:18px}
.prev{margin-top:10px;font-size:.92rem}.prev div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-top:1px dashed var(--bd)}.prev div span:last-child{text-align:right}
.err{color:var(--neg);font-size:.9rem;margin:8px 0}.err ul{margin:4px 0;padding-left:18px}
.okbox{margin-top:14px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--pos) 15%,var(--cd));border:2px solid var(--pos)}
.warn{margin:12px 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--wl) 15%,var(--cd));border:2px solid var(--wl)}
.warn button{margin-left:8px}
.link{background:none;border:0;padding:0;color:var(--wl);text-decoration:underline;font-size:.85rem}
.box{background:var(--cd);border:2px solid var(--bd);border-radius:14px;padding:14px}
.hero{max-width:560px;margin:40px auto;text-align:center}.hero p{color:var(--mu)}
.wbtn{background:var(--wl);color:#fff;border:0;font-weight:700}
.frm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.frm>input{flex:1 1 180px}
.tcard{background:var(--cd);border:2px solid var(--wl);border-radius:16px;padding:16px}
.thd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.nw{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}.kpis div{background:var(--sf);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}.kpis b{font-variant-numeric:tabular-nums}
.status{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.badge{font-size:.8rem;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--wl) 16%,var(--cd));border:1px solid var(--wl)}.badge.neg{background:color-mix(in srgb,var(--neg) 14%,var(--cd));border-color:var(--neg)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.acts button{flex:1 1 140px;font-weight:700}
.facs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.fac{background:var(--cd);border:2px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}.fac span{font-weight:800;font-size:1.1rem}.fac small{color:var(--mu)}.fac.off{opacity:.55}.fac button{margin-top:8px;padding:7px 10px;font-size:.88rem}
.tw{overflow-x:auto;border:2px solid var(--bd);border-radius:14px;background:var(--cd)}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:.8rem;color:var(--mu);white-space:nowrap}tr:last-child td{border-bottom:0}
td{font-variant-numeric:tabular-nums}tr.dim td{color:var(--mu)}
.ct td{min-width:150px}.ct .mw,.ct .qty,.ct .pct{max-width:180px}.pct{text-align:right;width:90px}
.mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.mkc{background:var(--cd);border:2px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.meter{height:8px;border-radius:99px;background:var(--sf);overflow:hidden;margin:4px 0}.meter i{display:block;height:100%;background:var(--wl)}
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--bd)}.hrow:first-child{border-top:0}
.hrow .amt{text-align:right;font-variant-numeric:tabular-nums}.hrow .meta{font-size:.82rem;color:var(--mu)}
.hrow .undo{grid-column:2;justify-self:end;align-self:end;font-size:.78rem;padding:3px 8px;border-radius:8px}
.hrow.undone{opacity:.5}.hrow.undone b{text-decoration:line-through}
.join .jrow{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.arow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}.arow:first-child{border-top:0}
.grow{flex:1;min-width:0}.grow input{width:100%;font-weight:700;margin-bottom:4px}
.ord{display:flex;flex-direction:column;gap:4px}.ord button{padding:5px 9px;font-size:.82rem;white-space:nowrap}
.pin{font-family:ui-monospace,Menlo,monospace;letter-spacing:.1em;font-size:1rem}
.mini{padding:0 8px;border-radius:6px;font-weight:700}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:12px}.cfg label,.form label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600}
.form label{margin:8px 0}.form input,.form select{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filebtn{position:relative;overflow:hidden;display:inline-block;background:var(--cd);border:2px solid var(--bd);border-radius:12px;padding:9px 12px;cursor:pointer}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upbox{margin:12px 0;padding:12px;border:2px dashed var(--wl);border-radius:12px}
.clist{max-height:420px;overflow:auto;margin:6px 0 12px;border-top:1px solid var(--bd)}
.citem{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}.citem .mu{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.pick button{padding:7px 10px;font-size:.88rem}.pick button.on,.adj button.on,.sclist button.on{border-color:var(--wl);background:color-mix(in srgb,var(--wl) 18%,var(--cd));font-weight:700}
.adj{display:flex;flex-wrap:wrap;gap:4px}.adj button{padding:5px 8px;font-size:.82rem}
.scbox{padding:12px;border-radius:12px;background:var(--sf);margin-bottom:12px}.scbox .hd{margin:0 0 8px}
.scres{padding:10px;border-radius:10px;background:var(--cd);margin-bottom:8px;font-weight:400}.scres b{font-size:1.05rem}
.sclist{display:grid;gap:6px;margin-top:8px}.sclist button{text-align:left;display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:.88rem}
details summary{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;max-width:calc(100% - 28px);font-size:.92rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media(max-width:560px){.nav3.n4{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.nav3 button{font-size:.85rem;padding:12px 4px}.fr{grid-template-columns:1fr}.nw{text-align:left}.join .jrow{grid-template-columns:1fr 80px}.join .jrow button{grid-column:1/-1}}

/* ===== Tampilan Langkah Barakah ===== */
h1,h2,h3,.ttl,.big,.big2,.tabs button,.wbtn,.cl,.rnd,.nav3 button,.chip,th,.play{font-family:var(--f-d);font-weight:400;letter-spacing:.02em}
.w{max-width:1080px;padding:16px}
.top{background:var(--wl);color:#fff;padding:10px 16px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);margin-bottom:14px}
.top .mu{color:#EBD6F6}
.brand{font-size:1.9rem;line-height:1.1;color:var(--yel);text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.role{background:var(--cream);color:var(--ink);border:2px solid var(--ink)}.role.adm{background:var(--yel);color:var(--ink);border-color:var(--ink)}
.tabs button{border:2px solid var(--ink);background:var(--cream);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.tabs button.on{background:var(--yel);color:var(--ink)}
.wbtn,.cl,.rnd{border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:12px}
.wbtn{background:var(--wl);color:#fff}
.turn,.box,.tcard,.fac,.mkc,.tw{border-color:var(--ink);border-width:2px}
.turn{border-radius:16px;background:var(--cd)}
.chip.on{background:var(--yel);border-color:var(--ink);color:var(--ink)}
.cd{border:3px solid var(--ink);border-top:12px solid var(--c);border-radius:18px}
.nb{border-width:2px}
.kpis div{border:1.5px solid var(--bd)}

/* Papan */
.bwrap{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.bd{position:relative;width:min(100%,780px);margin:0 auto;aspect-ratio:1;display:grid;grid-template:repeat(7,1fr)/repeat(7,1fr);background:var(--mat);border:4px solid var(--ink);border-radius:18px;overflow:hidden;container-type:inline-size;box-shadow:0 6px 0 var(--ink)}
.tl{position:relative;border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;min-width:0;overflow:hidden;padding:1cqw 0 0}
.t-start{background:#D63AA8}.t-pos{background:#35B467}.t-neg{background:#E04A4A}.t-fin{background:#2F6FD6}.t-inv{background:#F4A783}.t-land{background:#FFD93B}
.num{position:absolute;left:2%;top:2%;font-family:var(--f-d);font-size:max(9px,2.4cqw);line-height:1.2;background:var(--cream);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:0 .8cqw;z-index:2}
.ic{width:46%;aspect-ratio:1;margin-top:3.2cqw;display:block;flex:none}
.ic svg{width:100%;height:100%;display:block}
.lb{font-size:max(6px,1.45cqw);font-weight:700;line-height:1.1;background:var(--cream);color:var(--ink);border-radius:99px;padding:0 .9cqw;margin-top:.5cqw;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:clip}
.pws{position:absolute;left:0;right:0;bottom:0;top:30%;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:1px;z-index:3;pointer-events:none}
.pw{width:min(46%,calc(94% / var(--c)));aspect-ratio:24/32;display:block;filter:drop-shadow(0 1px 0 rgba(255,255,255,.7))}
.pw svg{width:100%;height:100%;display:block}
.pw.act{animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10%)}}
.mat{grid-area:2/2/7/7;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;padding:2.5cqw 2cqw 2cqw;overflow:hidden;background-color:var(--mat);background-image:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);background-size:4.6cqw 4.6cqw;container-type:normal}
.bunt{position:absolute;left:0;top:0;width:100%;height:7cqw;pointer-events:none}
.ttlbox{position:relative;z-index:1;margin-top:3cqw;background:var(--yel);border:3px solid var(--ink);border-radius:50%/55%;padding:.8cqw 4cqw;font-family:var(--f-d);font-size:max(15px,3.8cqw);line-height:1;color:var(--wl);text-align:center;text-shadow:1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink),0 2px 0 var(--ink);letter-spacing:.04em}
.wh{position:relative;width:min(33cqw,100%);aspect-ratio:1;flex:none;z-index:1}
.wh>svg{width:100%;height:100%;display:block;overflow:visible}
.ptr{position:absolute;left:50%;top:-3.2%;width:9%;transform:translateX(-50%);z-index:3}
.ptr svg{display:block;width:100%}
.play{position:relative;z-index:1;font-size:max(16px,3.4cqw);background:var(--wl);color:var(--yel);border:3px solid var(--ink);border-radius:12px;padding:.3cqw 4cqw;box-shadow:0 4px 0 var(--ink);cursor:pointer;line-height:1.3}
.play:disabled{opacity:.55;cursor:not-allowed}
.play:not(:disabled):hover{filter:brightness(1.1)}
.st{position:relative;z-index:1;background:var(--cream);color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:0 2.5cqw;font-size:max(12px,2cqw);font-weight:600;text-align:center;max-width:96%;line-height:1.35}
.dc{position:absolute;pointer-events:none;z-index:0}
.dc1{left:1.5cqw;bottom:2cqw;width:11cqw}.dc2{right:1.5cqw;bottom:2cqw;width:12cqw}.dc3{left:1.5cqw;top:9cqw;width:8cqw}.dc4{right:1.5cqw;top:10cqw;width:7cqw}
@container (max-width:560px){.dc{display:none}}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.88rem}
.leg span{display:inline-flex;align-items:center;gap:6px}

function saveG(g){G=g;rr();if(MODE=="db"){const snap=clone(g);wq=wq.then(()=>DB.doc("game/state").set(snap).catch(onErr))}else lsSave();return wq}
function addLog(e){e.id=e.id||uid();if(MODE=="db"){wq=wq.then(()=>DB.collection("log").doc(e.id).set(e).catch(onErr))}else{L.unshift(e);lsSave();rr()}}
function updLog(id,p){if(MODE=="db"){wq=wq.then(()=>DB.collection("log").doc(id).update(p).catch(onErr))}else{const x=L.find(l=>l.id==id);if(x)Object.assign(x,p);lsSave();rr()}}
function saveCards(arr){CARDS=arr;if(MODE=="db"){wq=wq.then(()=>DB.doc("data/admin/cfg/cards").set({D:arr,t:Date.now()}).catch(onErr))}else lsSave();rr()}

async function boot(){
 let db=null;try{if(window.claude&&typeof claude.use=="function")db=await claude.use("db")}catch(e){}
 if(db){MODE="db";DB=db;
  try{USER=await claude.use("user")}catch(e){}
  if(USER){try{UID=await USER.id();ADMIN=!!(await USER.canEdit());const w=await USER.can("data.write");RO=w===false}catch(e){}}
  DB.doc("game/state").onSnapshot(s=>{G=s.exists?fixCfg(clone(s.data())):null;READY=true;render()},onErr);
  DB.collection("log").orderBy("t","desc").limit(1000).onSnapshot(s=>{L=s.docs.map(d=>clone(d.data()));render()},onErr);
  DB.doc("data/admin/cfg/cards").onSnapshot(s=>{const d=s.exists&&s.data();CARDS=d&&Array.isArray(d.D)&&d.D.length?clone(d.D):null;render()},onErr);
 }else{MODE="local";ADMIN=true;try{const x=JSON.parse(localStorage.getItem("lks2")||"null");if(x){G=fixCfg(x.G||null);L=x.L||[];CARDS=x.CARDS||null}}catch(e){}READY=true}
 if(!ADMIN&&U.tab=="main")U.tab="tim";
 rr();
}

/* ===== Perubahan saldo dan aset (delta) ===== */
function applyDelta(g,ch,sign){
 for(const id in (ch.teams||{})){const T=g.teams[id];if(!T)continue;const d=ch.teams[id];
  T.cash+=sign*(d.cash||0);T.dd+=sign*(d.dd||0);T.ins+=sign*(d.ins||0);T.debt.out+=sign*(d.debt||0);if(d.du)T.debt.used=sign>0;
  T.skip=Math.max(0,T.skip+sign*(d.skip||0));T.years+=sign*(d.years||0);
  for(const a in (d.a||{})){const x=T.assets[a],y=d.a[a];x.q+=sign*(y.q||0);x.v+=sign*(y.v||0);x.c+=sign*(y.c||0);if(x.q<=0){x.q=0;x.v=0;x.c=0}}
  if(d.vc){T.vc=T.vc||[];if(sign>0)T.vc=T.vc.concat(d.vc);else T.vc=T.vc.filter(v=>!d.vc.some(x=>x.id==v.id))}
  if(d.vu){T.vc=T.vc||[];for(const id in d.vu){const v=T.vc.find(x=>x.id==id);if(v)v.u=Math.max(0,(v.u||0)+sign*d.vu[id])}}
  if(d.fx){if(sign>0)T.fx=(T.fx||[]).concat(d.fx);else T.fx=(T.fx||[]).filter(f=>!d.fx.some(x=>x.id==f.id))}}
 for(const a in (ch.stock||{}))g.stock[a]+=sign*ch.stock[a];
}

function parse(txt){const e={s:0,o:0,ob:0,t:0,tg:""};txt=txt.replace(/voucher[\s\S]*$/i,"");const m=txt.match(/\b(terima|bayar|dapatkan|tambahan pengeluaran)\b[^.,;]{0,30}?Rp\s?([\d.]+)/i);if(!m)return e;
 let v=+m[2].replace(/\./g,"");if(/^(bayar|tambahan pengeluaran)/i.test(m[1]))v=-v;const r=txt.slice(m.index);
 if(/dari setiap (pemain|tim)/i.test(r))e.o=v;else if(/\b(ke|kepada)\s+(salah satu\s+)?tim\b/i.test(r))e.t=v;else e.s=v;return e}

function detectFx(txts){const out=[],r=G.round;txts.forEach(t=>{const n=+((t.match(/(\d)\s*putaran/i)||[])[1]||1),until=r+n;
 const add=(k,label,cls)=>out.push({id:uid(),k,label:`${label} (s.d. putaran ${until})`,cls:cls||null,until});
 if(/tidak boleh beli aset/i.test(t))add("noBuy","Tidak boleh membeli aset");
 if(/tidak boleh investasi|larangan membeli instrumen investasi/i.test(t))add("noInv","Tidak boleh membeli instrumen investasi");
 if(/tidak boleh (beli|transaksi) equity/i.test(t))add("noEq","Tidak boleh transaksi saham");
 if(/tidak boleh kartu positif/i.test(t))add("noPos","Kartu positif tidak berlaku");
 let cls=null;if(/equity|saham/i.test(t))cls=["saham"];else if(/fixed income/i.test(t))cls=["sukuk","rpu"];else if(/sewa|land|building|aset ini|properti/i.test(t))cls=["apt","rumah"];
 if(cls&&!/tidak boleh (beli|transaksi)/i.test(t)){if(/(\bnol\b|tidak menerima|tidak menghasilkan|tidak boleh disewakan|tidak disewakan)/i.test(t))add("g0",`Kenaikan nilai ${clsName(cls)} 0%`,cls);else if(/turun (1 tingkat|50%)/i.test(t))add("gh",`Kenaikan nilai ${clsName(cls)} dipotong setengah`,cls)}});return out}
function extras(c,txts){const T=txts.join(" · "),x={skip:0,fx:[],insMode:0,ddMode:0,insGain:0,debt:0};
 if(/lewat(i|kan)\s+1\s+giliran/i.test(T))x.skip=1;
 if(c.k!="positif")x.fx=detectFx(txts);
 if(/(gunakan|serahkan)[^.]*asuransi/i.test(T))x.insMode=1;
 if(/(ambil|tukarkan)[^.]*asuransi/i.test(T))x.insGain=1;
 if(/(gunakan|serahkan)[^.]*dana darurat/i.test(T))x.ddMode=1;
 if(/utang qardh/i.test(T))x.debt=parseRp(c.m);
 return x}

function newGame(){ask("Mulai permainan baru? Semua tim kembali ke saldo awal, aset dan kartu dikembalikan, putaran kembali ke 1, dan riwayat permainan lama disembunyikan. Anggota tim dan pengaturan tetap.",()=>{const g=clone(G);g.gid=uid();g.round=1;g.turn=0;g.over=false;g.open=null;g.spin=null;g.land={};g.lq={};g.pause=null;g.pzTot=0;g.tend=null;g.tgt=null;g.t0=null;g.stock=clone(g.cfg.cap);g.used={positif:[],negatif:[],tantangan:[]};g.ord=mkOrd();
 Object.values(g.teams).forEach(T=>{const b=blankTeam(T.name,g.cfg);Object.assign(T,{cash:b.cash,dd:1,ins:1,debt:b.debt,assets:b.assets,skip:0,fx:[],years:0,vc:[],pos:0,sp:0})});saveG(g);logSimple("Permainan baru dimulai",`${g.order.length} tim, saldo awal ${rp(g.cfg.start)}`,g)},"Mulai baru")}
function endGame(){ask("Akhiri permainan sekarang? Klasemen akhir dikunci, dan utang yang belum lunas akan mengurangi nilai akhir tim.",()=>{const g=clone(G);g.over=true;g.tend=Date.now();g.open=null;saveG(g);logSimple("Permainan berakhir","Klasemen akhir ditetapkan",g);U.tab="klasemen";rr()},"Akhiri permainan")}
function reopen(){const g=clone(G);if(g.tend&&g.t0)g.t0+=Date.now()-g.tend;g.tend=null;g.over=false;saveG(g)}
function addTeam(){const n=($("nt").value||"").trim()||("Tim "+(G.order.length+1));const g=clone(G),t=blankTeam(n,g.cfg);g.teams[t.id]=t;g.order.push(t.id);saveG(g);logSimple("Tim bergabung",`${n} · saldo awal ${rp(g.cfg.start)}, 1 Kartu Dana Darurat, 1 Kartu Asuransi`,g)}
function renTeam(id,v){v=v.trim();if(!v)return;const g=clone(G);g.teams[id].name=v;saveG(g)}
function newPin(id){const g=clone(G);g.teams[id].pin=String(1000+Math.random()*9000|0);saveG(g)}
function delTeam(id){ask(`Hapus ${tName(id)} dari permainan?`,()=>{const g=clone(G);const cur=curTid();AK.forEach(a=>{g.stock[a]+=g.teams[id].assets[a].q});delete g.teams[id];g.order=g.order.filter(x=>x!=id);g.turn=Math.max(0,g.order.indexOf(cur==id?g.order[0]:cur));saveG(g)},"Hapus tim")}
function moveTeam(id,d){const g=clone(G),cur=curTid(),i=g.order.indexOf(id),j=i+d;if(j<0||j>=g.order.length)return;[g.order[i],g.order[j]]=[g.order[j],g.order[i]];g.turn=Math.max(0,g.order.indexOf(cur));saveG(g)}
function kick(id,m){const g=clone(G);g.teams[id].members=g.teams[id].members.filter(x=>x!=m);saveG(g)}
function joinTeam(id){const p=($("pin_"+id).value||"").trim();if(p!=G.teams[id].pin)return tell("Kode tim salah. Tanyakan kode 4 angka kepada admin.");const g=clone(G);Object.values(g.teams).forEach(T=>T.members=(T.members||[]).filter(x=>x!=UID));g.teams[id].members.push(UID);saveG(g);toast(`Anda bergabung dengan ${g.teams[id].name}.`)}
function leaveTeam(){ask("Keluar dari tim ini? Anda bisa bergabung lagi dengan kode tim.",()=>{const g=clone(G);Object.values(g.teams).forEach(T=>T.members=(T.members||[]).filter(x=>x!=UID));saveG(g)},"Keluar")}
function saveCfg(){const g=clone(G),c=g.cfg;c.start=mval("c_start");c.startBonus=mval("c_sb");c.dd=mval("c_dd");c.ins=mval("c_ins");c.debtMax=mval("c_debt");
 AK.forEach(a=>{c.price[a]=mval("c_p_"+a)||c.price[a];if(INC.includes(a))c.inc[a]=mval("c_v_"+a);else c.rent[a]=mval("c_v_"+a)});
 saveG(g);toast("Pengaturan disimpan.")}
const heldQ=(g,a)=>Object.values(g.teams).reduce((s,T)=>s+T.assets[a].q,0);
function saveStock(){const g=clone(G),c=g.cfg,bad=[],cap={};
 AK.forEach(a=>{const v=mval("c_c_"+a),h=heldQ(g,a);cap[a]=v;if(v<h)bad.push(`${AS[a].n} minimal ${h} ${AS[a].u} (sedang dimiliki tim)`)});
 if(bad.length)return tell("Jumlah tidak boleh kurang dari aset yang sedang dimiliki tim: "+bad.join("; ")+".");
 AK.forEach(a=>{c.cap[a]=cap[a];g.stock[a]=cap[a]-heldQ(g,a)});saveG(g);logSimple("Jumlah aset diatur admin",AK.map(a=>`${AS[a].n} ${cap[a]} ${AS[a].u}`).join(" · "),g);toast("Jumlah aset tersedia disimpan.")}
function rebuildDeck(){const g=clone(G);g.ord=mkOrd();g.used={positif:[],negatif:[],tantangan:[]};g.open=null;saveG(g);toast("Dek kartu disiapkan ulang.")}

/* ===== Admin: editor kartu ===== */
function ceTab(k){U.ce=k;rr()}
function editCard(i){U.modal={type:"card",i,k:i<0?U.ce:null};rr()}
function cardForm(c,kind){const v=f=>esc(c?c[f]||"":"");
 if(kind=="positif")return`<label>Judul<input id="e_t" value="${v("t")}"></label><label>Opsi A<textarea id="e_a">${v("a")}</textarea></label><label>Opsi B<textarea id="e_b">${v("b")}</textarea></label>`;
 if(kind=="negatif")return`<label>Judul<input id="e_t" value="${v("t")}"></label><label>Nominal kerugian${mIn("e_m",c?parseRp(c.m):0)}</label><label>Subjudul<input id="e_s" value="${v("s")}"></label><label>Opsi A<textarea id="e_a">${v("a")}</textarea></label><label>Opsi B<textarea id="e_b">${v("b")}</textarea></label><label>Pesan hikmah<input id="e_w" value="${v("w")}"></label>`;
 if(kind=="tantangan")return`<label>Judul<input id="e_t" value="${v("t")}"></label>${[0,1,2,3,4].map(i=>`<label>Efek ${i+1}${i>0?" (opsional)":""}<textarea id="e_l${i}">${esc(c&&c.l&&c.l[i]||"")}</textarea></label>`).join("")}`;
 return`<label>Judul<input id="e_t" value="${v("t")}"></label><label>Pertanyaan<textarea id="e_q">${v("q")}</textarea></label>${[0,1,2,3].map(i=>`<label>Pilihan ${"ABCD"[i]}<input id="e_o${i}" value="${esc(c&&c.o?c.o[i]:"")}"></label>`).join("")}<div class="two"><label>Jawaban benar<select id="e_c">${[0,1,2,3].map(i=>`<option value="${i}" ${c&&c.c==i?"selected":""}>${"ABCD"[i]}</option>`).join("")}</select></label><label>Hadiah benar${mIn("e_p",c?c.p:300000)}</label></div><label>Penalti jika salah${mIn("e_pw",c?(c.pw==null?c.p:c.pw):0)}</label>`}
function readForm(kind){const g=id=>($(id)?$(id).value:"").trim();const t=g("e_t");if(!t)return{err:"Judul wajib diisi."};
 if(kind=="positif"){if(!g("e_a")||!g("e_b"))return{err:"Opsi A dan B wajib diisi."};return{c:{k:"positif",t,a:g("e_a"),b:g("e_b")}}}
 if(kind=="negatif"){if(!g("e_a")||!g("e_b"))return{err:"Opsi A dan B wajib diisi."};const m=mval("e_m");return{c:{k:"negatif",t,m:m?rp(m):"",s:g("e_s"),a:g("e_a"),b:g("e_b"),w:g("e_w")}}}
 if(kind=="tantangan"){const l=[0,1,2,3,4].map(i=>g("e_l"+i)).filter(Boolean);if(!l.length)return{err:"Minimal satu efek wajib diisi."};return{c:{k:"tantangan",t,l}}}
 const o=[0,1,2,3].map(i=>g("e_o"+i));if(!g("e_q")||o.some(x=>!x))return{err:"Pertanyaan dan keempat pilihan wajib diisi."};return{c:{k:"quiz",t,q:g("e_q"),o,c:+$("e_c").value,p:mval("e_p")||300000,pw:mval("e_pw")}}}
function saveCard(){const m=U.modal,d=clone(D()),kind=m.i<0?($("e_kind")?$("e_kind").value:m.k):(D()[m.i].k);const r=readForm(kind);if(r.err)return tell(r.err);
 if(m.i<0){d.push(r.c);closeModal();saveCards(d);if(G){const g=clone(G);g.ord=mkOrdFrom(d);g.used={positif:[],negatif:[],tantangan:[]};g.open=null;saveG(g)}toast("Kartu baru ditambahkan di nomor paling akhir.")}
 else{d[m.i]=r.c;closeModal();saveCards(d);toast("Kartu diperbarui.")}}
function mkOrdFrom(d){const keep=CARDS;CARDS=d;const o=mkOrd();CARDS=keep;return o}
function delCard(i){ask(`Hapus kartu “${D()[i].t}”? Semua nomor aktif kembali.`,()=>{const d=clone(D());d.splice(i,1);saveCards(d);if(G){const g=clone(G);g.ord=mkOrd();g.used={positif:[],negatif:[],tantangan:[]};g.open=null;saveG(g)}},"Hapus kartu")}
function setKind(v){U.modal.k=v;rr()}

/* ===== Excel ===== */
const SH={Positif:["Judul","Opsi A","Opsi B"],Negatif:["Judul","Nominal (Rp)","Subjudul","Opsi A","Opsi B","Pesan hikmah"],Tantangan:["Judul","Efek 1","Efek 2","Efek 3","Efek 4","Efek 5"],Kuis:["Judul","Pertanyaan","Pilihan A","Pilihan B","Pilihan C","Pilihan D","Jawaban benar (A/B/C/D)","Hadiah benar (Rp)","Penalti salah (Rp)"]};
let xl=null;function xlsxLib(){if(window.XLSX)return Promise.resolve(window.XLSX);if(!xl)xl=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>{xl=null;rej(new Error("x"))};document.head.appendChild(s)});return xl}
async function saveFile(name,blob){let dl=null;try{if(window.claude&&typeof claude.use=="function")dl=await claude.use("downloads")}catch(e){}
 if(dl){try{await dl.save({filename:name,data:blob});toast("File dikirim ke perangkat Anda.")}catch(e){toast("Unduhan dibatalkan.")}return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function dlXlsx(){let X;try{X=await xlsxLib()}catch(e){return tell("Pustaka Excel gagal dimuat. Periksa koneksi internet lalu coba lagi.")}
 const d=D(),rows={Positif:[],Negatif:[],Tantangan:[],Kuis:[]};
 d.forEach(c=>{if(c.k=="positif")rows.Positif.push([c.t,c.a,c.b]);else if(c.k=="negatif")rows.Negatif.push([c.t,parseRp(c.m)||"",c.s||"",c.a,c.b,c.w||""]);else if(c.k=="tantangan")rows.Tantangan.push([c.t,...[0,1,2,3,4].map(i=>c.l[i]||"")]);else rows.Kuis.push([c.t,c.q,...c.o,"ABCD"[c.c],c.p,c.pw==null?c.p:c.pw])});
 const wb=X.utils.book_new();const help=[["Petunjuk pengisian"],["1. Satu baris = satu kartu. Baris pertama setiap sheet adalah judul kolom, jangan diubah."],["2. Nama sheet harus tetap: Positif, Negatif, Tantangan, Kuis."],["3. Nominal dan Poin diisi angka saja, tanpa Rp dan titik. Contoh: 1200000."],["4. Jawaban benar diisi satu huruf: A, B, C, atau D."],["5. Tulis nominal di teks opsi dengan format Rp diikuti angka bertitik, misalnya “Terima Rp500.000” atau “Bayar Rp1.200.000”, agar terbaca otomatis oleh dompet."],["6. Kata kunci otomatis: “lewati 1 giliran”, “gunakan asuransi”, “gunakan dana darurat”, “utang qardh”, “tidak boleh beli aset”, “1 putaran”/“2 putaran”."]];
 X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(help),"Petunjuk");
 for(const s in SH){const ws=X.utils.aoa_to_sheet([SH[s],...rows[s]]);ws["!cols"]=SH[s].map((h,i)=>({wch:i==0?28:/Opsi|Efek|Pertanyaan|Pilihan/.test(h)?48:18}));X.utils.book_append_sheet(wb,ws,s)}
 const out=X.write(wb,{bookType:"xlsx",type:"array"});await saveFile("kartu-literasi-keuangan-syariah.xlsx",new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))}
async function upXlsx(f){if(!f)return;let X;try{X=await xlsxLib()}catch(e){return tell("Pustaka Excel gagal dimuat. Periksa koneksi internet lalu coba lagi.")}
 let wb;try{wb=X.read(await f.arrayBuffer())}catch(e){return tell("File tidak bisa dibaca. Pastikan formatnya .xlsx sesuai template.")}
 const cards=[],errs=[],cnt={Positif:0,Negatif:0,Tantangan:0,Kuis:0};const find=n=>wb.SheetNames.find(s=>s.trim().toLowerCase()==n.toLowerCase());
 const S=v=>String(v==null?"":v).trim();
 for(const s in SH){const nm=find(s);if(!nm)continue;const rows=X.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:""});
  rows.slice(1).forEach((r,ix)=>{const row=ix+2;if(!r.some(x=>S(x)))return;const t=S(r[0]);if(!t){errs.push(`${s} baris ${row}: judul kosong`);return}
   if(s=="Positif"){if(!S(r[1])||!S(r[2]))return errs.push(`${s} baris ${row}: Opsi A/B kosong`);cards.push({k:"positif",t,a:S(r[1]),b:S(r[2])})}
   else if(s=="Negatif"){if(!S(r[3])||!S(r[4]))return errs.push(`${s} baris ${row}: Opsi A/B kosong`);const m=parseRp(r[1]);cards.push({k:"negatif",t,m:m?rp(m):"",s:S(r[2]),a:S(r[3]),b:S(r[4]),w:S(r[5])})}
   else if(s=="Tantangan"){const l=r.slice(1,6).map(S).filter(Boolean);if(!l.length)return errs.push(`${s} baris ${row}: belum ada efek`);cards.push({k:"tantangan",t,l})}
   else{const o=r.slice(2,6).map(S),c="ABCD".indexOf(S(r[6]).toUpperCase());if(!S(r[1])||o.some(x=>!x))return errs.push(`${s} baris ${row}: pertanyaan/pilihan belum lengkap`);if(c<0)return errs.push(`${s} baris ${row}: jawaban harus A, B, C, atau D`);cards.push({k:"quiz",t,q:S(r[1]),o,c,p:parseRp(r[7])||300000,pw:parseRp(r[8])})}
   cnt[s]++})}
 if(!cards.length&&!errs.length)errs.push("Tidak ada kartu ditemukan. Pastikan nama sheet Positif, Negatif, Tantangan, dan Kuis.");
 U.up={cards,errs,cnt,name:f.name};rr()}
function applyUp(mode){const up=U.up;if(!up||!up.cards.length)return;ask(mode=="replace"?`Ganti seluruh kartu dengan ${up.cards.length} kartu dari ${up.name}? Semua nomor aktif kembali.`:`Tambahkan ${up.cards.length} kartu dari ${up.name}? Semua nomor aktif kembali.`,()=>{
 const d=mode=="replace"?up.cards:clone(D()).concat(up.cards);saveCards(d);if(G){const g=clone(G);g.ord=mkOrdFrom(d);g.used={positif:[],negatif:[],tantangan:[]};g.open=null;saveG(g)}U.up=null;toast("Kartu berhasil diunggah.")},mode=="replace"?"Ganti semua":"Tambahkan")}
function resetCards(){ask("Kembalikan semua kartu ke isi bawaan? Perubahan dari admin dan Excel akan hilang.",()=>{if(MODE=="db"){CARDS=null;wq=wq.then(()=>DB.doc("data/admin/cfg/cards").delete().catch(onErr))}else{CARDS=null;lsSave()}if(G){const g=clone(G);g.ord=mkOrdFrom(DEFAULT_CARDS);g.used={positif:[],negatif:[],tantangan:[]};g.open=null;saveG(g)}else rr()},"Kembalikan")}

/* ===== Tampilan ===== */
function tab(k){U.tab=k;rr()}
function setAs(id){U.as=id;rr()}
function rr(){U.force=true;render()}
function render(){if(spinAnim){pendR=true;return}const a=document.activeElement;if(!U.force&&a&&a.closest&&a.closest("#app")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){U.pend=true;return}U.force=false;U.pend=false;
 const app=$("app");if(!READY){app.innerHTML=`<div class="load">Memuat permainan…</div>`;return}
 if(G)syncOpen();
 const ns=G?spinHook():null;let h=header();
 if(!G)h+=noGame();
 else{h+=nav();h+=({papan:papanV,main:mainV,tim:teamV,pasar:marketV,klasemen:boardV,riwayat:logV,admin:adminV}[U.tab]||papanV)()}
 if(G&&G.open&&(U.tab=="main"||U.tab=="papan")&&card(G.open))h+=`<div class="ov ${CAT[G.open.k].c}"><div class="cd">${cardH()}</div></div>`;
 if(U.pickDeck&&G&&G.ord&&G.ord[U.pickDeck.deck]&&!(G.open&&!G.open.done))h+=deckPickH();if(U.modal)h+=modalH();
 if(Q)h+=`<div class="ov qd"><div class="cd" role="alertdialog" aria-modal="true"><p class="qm">${esc(Q.m)}</p>${Q.f?`<div class="qb"><button onclick="qNo()">${esc(Q.ny||"Batal")}</button><button class="cl" onclick="qYes()">${esc(Q.y)}</button></div>`:`<button class="cl" onclick="qYes()">Oke</button>`}</div></div>`;
 if(U.toast)h+=`<div class="toast" role="status">${esc(U.toast)}</div>`;
 app.innerHTML=h;prev();if($("bprev"))buyPrev();if($("sprev"))sellPrev();if($("rprev"))rentPrev();if(ns)animateSpin(ns)}
document.addEventListener("focusout",()=>setTimeout(()=>{if(U.pend&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},0));

function header(){const me=myTeam();let role=MODE=="local"?"Mode satu perangkat":ADMIN?"Admin":me?`Pemain · ${esc(me.name)}`:"Penonton";
 let s=G?`Putaran ${G.round}${G.order.length?` · giliran <b>${esc(tName(curTid()))}</b>`:""}${G.over?" · <b>permainan selesai</b>":""}`:"";
 return`<header class="top"><div><div class="ttl brand">Langkah Barakah</div><div class="mu">${s}</div></div><span class="role ${ADMIN?"adm":""}">${role}</span></header>`}
function nav(){const t=[["papan","Papan"],["main","Kartu"],["tim","Tim"],["pasar","Pasar"],["klasemen","Klasemen"],["riwayat","Riwayat"]];if(ADMIN)t.push(["admin","Admin"]);return`<nav class="tabs">${t.map(([k,n])=>`<button class="${U.tab==k?"on":""}" onclick="tab('${k}')">${n}</button>`).join("")}</nav>`}
function noGame(){if(ADMIN)return`<div class="box hero"><h1>Siapkan permainan</h1><p>Buat permainan baru, lalu tambahkan tim di menu Admin. Setiap tim akan mendapat saldo awal ${rp(CFG0.start)}, Kartu Dana Darurat ${rp(CFG0.dd)}, Kartu Asuransi All Risk ${rp(CFG0.ins)}, dan fasilitas utang qardh hingga ${rp(CFG0.debtMax)}.</p><button class="wbtn" onclick="createGame()">Buat permainan</button></div>`;
 return`<div class="box hero"><h1>Menunggu admin</h1><p>Permainan belum dibuat. Halaman ini akan terbuka otomatis setelah admin menyiapkan permainan.</p></div>`}

function turnBar(){if(!G.order.length)return`<div class="warn">Belum ada tim. ${ADMIN?"Tambahkan tim di menu Admin.":"Tunggu admin menambahkan tim."}</div>`;
 const cur=curTid();return`<div class="turn"><div class="order">${G.order.map(id=>{const T=G.teams[id];return`<span class="chip ${id==cur?"on":""}" ${ADMIN?`onclick="admTurn('${id}')" title="Admin: atur giliran ke tim ini"`:""}>${esc(T.name)}${T.skip?` <em>lewati ${T.skip}×</em>`:""}</span>`}).join("")}</div>${canAct(cur)?`<div class="tb"><button onclick="startOpen('${cur}')">🏁 Lewat Start</button><button class="wbtn" onclick="endTurn()">Selesai giliran ${esc(tName(cur))} →</button>${ADMIN?`<button class="endg" onclick="endGame()">Akhiri permainan</button>`:""}</div>`:""}</div>`}
function mainV(){const k=U.deck,cur=curTid(),act=canAct(cur);let h=turnBar()+kartuWheel();
 const nv=`<div class="nav3 n4">`+[...Object.keys(CAT),"investasi"].map(x=>`<button class="${x=="investasi"?"wl":CAT[x].c} ${x==k?"on":""}" onclick="setDeck('${x}')">${x=="investasi"?"Investasi":CAT[x].n}</button>`).join("")+`</div>`;
 if(k=="investasi")return h+nv+investV();
 const ct=CAT[k];
 if(deckStale())return h+nv+`<div class="warn">Isi kartu berubah sejak dek terakhir disiapkan. ${ADMIN?`<button class="wbtn" onclick="rebuildDeck()">Siapkan ulang dek</button>`:"Tunggu admin menyiapkan ulang dek."}</div>`;
 const tot=deckIdx(k).length,u=G.used[k];
 h+=nv;
 h+=`<div class="${ct.c}"><div class="hd"><div><h1>${ct.n}</h1><div class="mu">Sisa ${tot-u.length} dari ${tot} kartu${act&&u.length?" · ketuk nomor yang dicoret untuk mengaktifkannya kembali":""}${!act&&cur?` · menunggu giliran ${esc(tName(cur))}`:""}</div></div><button class="rnd" onclick="rnd()" ${u.length>=tot||!act?"disabled":""}>${CARDIC} Pilih kartu secara acak</button></div>
 <div class="gr">`+Array.from({length:tot},(_,i)=>`<button class="nb ${u.includes(i+1)?"used":""}" ${act?"":"disabled"} onclick="pickN(${i+1})">${i+1}</button>`).join("")+`</div></div>`;
 if(G.open&&!card(G.open))h+=`<div class="warn">Kartu yang terbuka sudah tidak ada. <button onclick="closeCard()">Tutup</button></div>`;
 if(ADMIN)h+=`<div class="rs"><button onclick="resetDeck()">Reset semua kartu</button></div>`;return h}

let AC=null,SG=null,MG=null,NB=null,SND=true,MUS=true,VS=.8,VM=.3;
try{const x=JSON.parse(localStorage.getItem("lb_aud")||"null");if(x){SND=x.sfx!==false;MUS=x.mus!==false;if(+x.vs>=0)VS=+x.vs;if(+x.vm>=0)VM=+x.vm}}catch(e){}

function audio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();SG=AC.createGain();MG=AC.createGain();SG.connect(AC.destination);MG.connect(AC.destination);SG.gain.value=SND?VS:0;MG.gain.value=MUS?VM*.5:0;
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 if(AC.state=="suspended")AC.resume();if(MUS)musicStart()}catch(e){}return AC}
document.addEventListener("pointerdown",audio);
function applyAud(){if(!AC)return;const t=AC.currentTime;SG.gain.setTargetAtTime(SND?VS:0,t,.03);MG.gain.setTargetAtTime(MUS?VM*.5:0,t,.08)}
function tone(f,t,d,ty,v,dest){const a=audio();if(!a||!SG)return;try{const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;o.type=ty||"square";o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(v||.07,s+.008);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(g);g.connect(dest||SG);o.start(s);o.stop(s+d+.03)}catch(e){}}
function noise(t,d,fq,q,v,dest,sweep){const a=audio();if(!a||!NB)return;try{const s=a.currentTime+t,n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();n.buffer=NB;f.type="bandpass";f.frequency.setValueAtTime(fq,s);if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,s+d);f.Q.value=q||1;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(v||.1,s+Math.min(.01,d/3));g.gain.exponentialRampToValueAtTime(0.0001,s+d);n.connect(f);f.connect(g);g.connect(dest||SG);n.start(s,Math.random()*.5);n.stop(s+d+.03)}catch(e){}}
/* Roda: bunyi klik tiap irisan melewati penunjuk, mengikuti kurva perlambatan putaran sebenarnya */
const easeX=t=>{const u=1-t;return 3*u*u*t*.1+3*u*t*t*.12+t*t*t};
function easeT(y){let lo=0,hi=1;const Y=t=>{const u=1-t;return 3*u*u*t*.75+3*u*t*t*1+t*t*t};for(let i=0;i<28;i++){const m=(lo+hi)/2;if(Y(m)<y)lo=m;else hi=m}return easeX((lo+hi)/2)}
function sndSpin(dur,D,w0){if(!SND)return;audio();const sec=dur/1000,th0=((w0%45)+45)%45,ks=[];
