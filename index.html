/* ===== Perubahan saldo dan aset (delta) ===== */
function applyDelta(g,ch,sign){
 for(const id in (ch.teams||{})){const T=g.teams[id];if(!T)continue;const d=ch.teams[id];
  T.cash+=sign*(d.cash||0);T.dd+=sign*(d.dd||0);T.ins+=sign*(d.ins||0);T.debt.out+=sign*(d.debt||0);if(d.du)T.debt.used=sign>0;
  T.skip=Math.max(0,T.skip+sign*(d.skip||0));T.years+=sign*(d.years||0);
  for(const a in (d.a||{})){const x=T.assets[a],y=d.a[a];x.q+=sign*(y.q||0);x.v+=sign*(y.v||0);x.c+=sign*(y.c||0);if(x.q<=0){x.q=0;x.v=0;x.c=0}}
  if(d.fx){if(sign>0)T.fx=(T.fx||[]).concat(d.fx);else T.fx=(T.fx||[]).filter(f=>!d.fx.some(x=>x.id==f.id))}}
 for(const a in (ch.stock||{}))g.stock[a]+=sign*ch.stock[a];
}

function parse(txt){const e={s:0,o:0,ob:0,t:0,tg:""};txt=txt.replace(/voucher[\s\S]*$/i,"");const m=txt.match(/\b(terima|bayar|dapatkan|tambahan pengeluaran)\b[^.,;]{0,30}?Rp\s?([\d.]+)/i);if(!m)return e;
 let v=+m[2].replace(/\./g,"");if(/^(bayar|tambahan pengeluaran)/i.test(m[1]))v=-v;const r=txt.slice(m.index);
 if(/dari setiap (pemain|tim)/i.test(r))e.o=v;else if(/\b(ke|kepada)\s+(salah satu\s+)?tim\b/i.test(r))e.t=v;else e.s=v;return e}

function detectFx(txts){const out=[],r=G.round;txts.forEach(t=>{const n=+((t.match(/(\d)\s*putaran/i)||[])[1]||1),until=r+n;
 const add=(k,label,cls)=>out.push({id:uid(),k,label:`${label} (s.d. putaran ${until})`,cls:cls||null,until});
 if(/tidak boleh beli aset/i.test(t))add("noBuy","Tidak boleh membeli aset");
 if(/tidak boleh investasi|larangan membeli instrumen investasi/i.test(t))add("noInv","Tidak boleh membeli instrumen investasi");
 if(/tidak boleh (beli|transaksi) equity/i.test(t))add("noEq","Tidak boleh transaksi saham");
 if(/tidak boleh kartu positif/i.test(t))add("noPos","Kartu positif tidak berlaku");
 let cls=null;if(/equity|saham/i.test(t))cls=["saham"];else if(/fixed income/i.test(t))cls=["sukuk","rpu"];else if(/sewa|land|building|aset ini|properti/i.test(t))cls=["apt","rumah"];
 if(cls&&!/tidak boleh (beli|transaksi)/i.test(t)){if(/(\bnol\b|tidak menerima|tidak menghasilkan|tidak boleh disewakan|tidak disewakan)/i.test(t))add("g0",`Kenaikan nilai ${clsName(cls)} 0%`,cls);else if(/turun (1 tingkat|50%)/i.test(t))add("gh",`Kenaikan nilai ${clsName(cls)} dipotong setengah`,cls)}});return out}
function extras(c,txts){const T=txts.join(" · "),x={skip:0,fx:[],insMode:0,ddMode:0,insGain:0,debt:0};

 const ch={teams:{[id]:{cash:v}}};if(cp)ch.teams[cp]={cash:-v};closeModal();commit(ch,{src:"Transaksi manual",txt:note||(cp?`Transfer dengan ${tName(cp)}`:(v>0?"Terima dari Bank":"Bayar ke Bank")),tid:id})}
function undo(id){const e=L.find(x=>x.id==id);if(!e||!e.ch)return;ask(`Batalkan “${e.src}”? Saldo, aset, dan kartu tim yang terkena akan dikembalikan.`,()=>{const g=clone(G);applyDelta(g,e.ch,-1);saveG(g);updLog(id,{undone:true})},"Batalkan transaksi")}

function createGame(){const g={gid:uid(),round:1,turn:0,order:[],teams:{},stock:clone(CFG0.cap),cfg:clone(CFG0),used:{positif:[],negatif:[],tantangan:[]},ord:mkOrd(),open:null,over:false,created:Date.now()};saveG(g);logSimple("Permainan dibuat","Tambahkan tim di menu Admin",g);U.tab="admin";rr()}
function newGame(){ask("Mulai permainan baru? Semua tim kembali ke saldo awal, aset dan kartu dikembalikan, putaran kembali ke 1, dan riwayat permainan lama disembunyikan. Anggota tim dan pengaturan tetap.",()=>{const g=clone(G);g.gid=uid();g.round=1;g.turn=0;g.over=false;g.open=null;g.stock=clone(g.cfg.cap);g.used={positif:[],negatif:[],tantangan:[]};g.ord=mkOrd();
 Object.values(g.teams).forEach(T=>{const b=blankTeam(T.name,g.cfg);Object.assign(T,{cash:b.cash,dd:1,ins:1,debt:b.debt,assets:b.assets,skip:0,fx:[],years:0})});saveG(g);logSimple("Permainan baru dimulai",`${g.order.length} tim, saldo awal ${rp(g.cfg.start)}`,g)},"Mulai baru")}
function endGame(){ask("Akhiri permainan sekarang? Klasemen akhir dikunci, dan utang yang belum lunas akan mengurangi nilai akhir tim.",()=>{const g=clone(G);g.over=true;g.open=null;saveG(g);logSimple("Permainan berakhir","Klasemen akhir ditetapkan",g);U.tab="klasemen";rr()},"Akhiri permainan")}
function reopen(){const g=clone(G);g.over=false;saveG(g)}
function addTeam(){const n=($("nt").value||"").trim()||("Tim "+(G.order.length+1));const g=clone(G),t=blankTeam(n,g.cfg);g.teams[t.id]=t;g.order.push(t.id);saveG(g);logSimple("Tim bergabung",`${n} · saldo awal ${rp(g.cfg.start)}, 1 Kartu Dana Darurat, 1 Kartu Asuransi`,g)}
function renTeam(id,v){v=v.trim();if(!v)return;const g=clone(G);g.teams[id].name=v;saveG(g)}
function newPin(id){const g=clone(G);g.teams[id].pin=String(1000+Math.random()*9000|0);saveG(g)}
function delTeam(id){ask(`Hapus ${tName(id)} dari permainan?`,()=>{const g=clone(G);const cur=curTid();AK.forEach(a=>{g.stock[a]+=g.teams[id].assets[a].q});delete g.teams[id];g.order=g.order.filter(x=>x!=id);g.turn=Math.max(0,g.order.indexOf(cur==id?g.order[0]:cur));saveG(g)},"Hapus tim")}
function moveTeam(id,d){const g=clone(G),cur=curTid(),i=g.order.indexOf(id),j=i+d;if(j<0||j>=g.order.length)return;[g.order[i],g.order[j]]=[g.order[j],g.order[i]];g.turn=Math.max(0,g.order.indexOf(cur));saveG(g)}
function kick(id,m){const g=clone(G);g.teams[id].members=g.teams[id].members.filter(x=>x!=m);saveG(g)}
function joinTeam(id){const p=($("pin_"+id).value||"").trim();if(p!=G.teams[id].pin)return tell("Kode tim salah. Tanyakan kode 4 angka kepada admin.");const g=clone(G);Object.values(g.teams).forEach(T=>T.members=(T.members||[]).filter(x=>x!=UID));g.teams[id].members.push(UID);saveG(g);toast(`Anda bergabung dengan ${g.teams[id].name}.`)}
function leaveTeam(){ask("Keluar dari tim ini? Anda bisa bergabung lagi dengan kode tim.",()=>{const g=clone(G);Object.values(g.teams).forEach(T=>T.members=(T.members||[]).filter(x=>x!=UID));saveG(g)},"Keluar")}
function saveCfg(){const g=clone(G),c=g.cfg;c.start=mval("c_start");c.dd=mval("c_dd");c.ins=mval("c_ins");c.debtMax=mval("c_debt");
 AK.forEach(a=>{c.price[a]=mval("c_p_"+a)||c.price[a];if(INC.includes(a))c.inc[a]=mval("c_v_"+a);else c.rent[a]=mval("c_v_"+a)});
 saveG(g);toast("Pengaturan disimpan.")}
const heldQ=(g,a)=>Object.values(g.teams).reduce((s,T)=>s+T.assets[a].q,0);
function saveStock(){const g=clone(G),c=g.cfg,bad=[],cap={};
 AK.forEach(a=>{const v=mval("c_c_"+a),h=heldQ(g,a);cap[a]=v;if(v<h)bad.push(`${AS[a].n} minimal ${h} ${AS[a].u} (sedang dimiliki tim)`)});
 if(bad.length)return tell("Jumlah tidak boleh kurang dari aset yang sedang dimiliki tim: "+bad.join("; ")+".");
 AK.forEach(a=>{c.cap[a]=cap[a];g.stock[a]=cap[a]-heldQ(g,a)});saveG(g);logSimple("Jumlah aset diatur admin",AK.map(a=>`${AS[a].n} ${cap[a]} ${AS[a].u}`).join(" · "),g);toast("Jumlah aset tersedia disimpan.")}
function rebuildDeck(){const g=clone(G);g.ord=mkOrd();g.used={positif:[],negatif:[],tantangan:[]};g.open=null;saveG(g);toast("Dek kartu disiapkan ulang dan diacak.")}

function ceTab(k){U.ce=k;rr()}
function editCard(i){U.modal={type:"card",i,k:i<0?U.ce:null};rr()}
function cardForm(c,kind){const v=f=>esc(c?c[f]||"":"");
 if(kind=="positif")return`<label>Judul<input id="e_t" value="${v("t")}"></label><label>Opsi A<textarea id="e_a">${v("a")}</textarea></label><label>Opsi B<textarea id="e_b">${v("b")}</textarea></label>`;
 if(kind=="negatif")return`<label>Judul<input id="e_t" value="${v("t")}"></label><label>Nominal kerugian${mIn("e_m",c?parseRp(c.m):0)}</label><label>Subjudul<input id="e_s" value="${v("s")}"></label><label>Opsi A<textarea id="e_a">${v("a")}</textarea></label><label>Opsi B<textarea id="e_b">${v("b")}</textarea></label><label>Pesan hikmah<input id="e_w" value="${v("w")}"></label>`;
 if(kind=="tantangan")return`<label>Judul<input id="e_t" value="${v("t")}"></label>${[0,1,2,3,4].map(i=>`<label>Efek ${i+1}${i>0?" (opsional)":""}<textarea id="e_l${i}">${esc(c&&c.l&&c.l[i]||"")}</textarea></label>`).join("")}`;
 return`<label>Judul<input id="e_t" value="${v("t")}"></label><label>Pertanyaan<textarea id="e_q">${v("q")}</textarea></label>${[0,1,2,3].map(i=>`<label>Pilihan ${"ABCD"[i]}<input id="e_o${i}" value="${esc(c&&c.o?c.o[i]:"")}"></label>`).join("")}<div class="two"><label>Jawaban benar<select id="e_c">${[0,1,2,3].map(i=>`<option value="${i}" ${c&&c.c==i?"selected":""}>${"ABCD"[i]}</option>`).join("")}</select></label><label>Poin${mIn("e_p",c?c.p:50000)}</label></div>`}
function readForm(kind){const g=id=>($(id)?$(id).value:"").trim();const t=g("e_t");if(!t)return{err:"Judul wajib diisi."};
 if(kind=="positif"){if(!g("e_a")||!g("e_b"))return{err:"Opsi A dan B wajib diisi."};return{c:{k:"positif",t,a:g("e_a"),b:g("e_b")}}}
 if(kind=="negatif"){if(!g("e_a")||!g("e_b"))return{err:"Opsi A dan B wajib diisi."};const m=mval("e_m");return{c:{k:"negatif",t,m:m?rp(m):"",s:g("e_s"),a:g("e_a"),b:g("e_b"),w:g("e_w")}}}
 if(kind=="tantangan"){const l=[0,1,2,3,4].map(i=>g("e_l"+i)).filter(Boolean);if(!l.length)return{err:"Minimal satu efek wajib diisi."};return{c:{k:"tantangan",t,l}}}
 const o=[0,1,2,3].map(i=>g("e_o"+i));if(!g("e_q")||o.some(x=>!x))return{err:"Pertanyaan dan keempat pilihan wajib diisi."};return{c:{k:"quiz",t,q:g("e_q"),o,c:+$("e_c").value,p:mval("e_p")||50000}}}
function saveCard(){const m=U.modal,d=clone(D()),kind=m.i<0?($("e_kind")?$("e_kind").value:m.k):(D()[m.i].k);const r=readForm(kind);if(r.err)return tell(r.err);
 if(m.i<0){d.push(r.c);closeModal();saveCards(d);if(G){const g=clone(G);g.ord=mkOrdFrom(d);g.used={positif:[],negatif:[],tantangan:[]};g.open=null;saveG(g)}toast("Kartu baru ditambahkan. Dek diacak ulang.")}
 else{d[m.i]=r.c;closeModal();saveCards(d);toast("Kartu diperbarui.")}}
function mkOrdFrom(d){const keep=CARDS;CARDS=d;const o=mkOrd();CARDS=keep;return o}
function delCard(i){ask(`Hapus kartu “${D()[i].t}”? Dek akan diacak ulang dan semua nomor aktif kembali.`,()=>{const d=clone(D());d.splice(i,1);saveCards(d);if(G){const g=clone(G);g.ord=mkOrd();g.used={positif:[],negatif:[],tantangan:[]};g.open=null;saveG(g)}},"Hapus kartu")}
function setKind(v){U.modal.k=v;rr()}

/* ===== Excel ===== */
const SH={Positif:["Judul","Opsi A","Opsi B"],Negatif:["Judul","Nominal (Rp)","Subjudul","Opsi A","Opsi B","Pesan hikmah"],Tantangan:["Judul","Efek 1","Efek 2","Efek 3","Efek 4","Efek 5"],Kuis:["Judul","Pertanyaan","Pilihan A","Pilihan B","Pilihan C","Pilihan D","Jawaban benar (A/B/C/D)","Poin (Rp)"]};
let xl=null;function xlsxLib(){if(window.XLSX)return Promise.resolve(window.XLSX);if(!xl)xl=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>{xl=null;rej(new Error("x"))};document.head.appendChild(s)});return xl}
async function saveFile(name,blob){let dl=null;try{if(window.claude&&typeof claude.use=="function")dl=await claude.use("downloads")}catch(e){}
 if(dl){try{await dl.save({filename:name,data:blob});toast("File dikirim ke perangkat Anda.")}catch(e){toast("Unduhan dibatalkan.")}return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function dlXlsx(){let X;try{X=await xlsxLib()}catch(e){return tell("Pustaka Excel gagal dimuat. Periksa koneksi internet lalu coba lagi.")}
 const d=D(),rows={Positif:[],Negatif:[],Tantangan:[],Kuis:[]};
 d.forEach(c=>{if(c.k=="positif")rows.Positif.push([c.t,c.a,c.b]);else if(c.k=="negatif")rows.Negatif.push([c.t,parseRp(c.m)||"",c.s||"",c.a,c.b,c.w||""]);else if(c.k=="tantangan")rows.Tantangan.push([c.t,...[0,1,2,3,4].map(i=>c.l[i]||"")]);else rows.Kuis.push([c.t,c.q,...c.o,"ABCD"[c.c],c.p])});
 const wb=X.utils.book_new();const help=[["Petunjuk pengisian"],["1. Satu baris = satu kartu. Baris pertama setiap sheet adalah judul kolom, jangan diubah."],["2. Nama sheet harus tetap: Positif, Negatif, Tantangan, Kuis."],["3. Nominal dan Poin diisi angka saja, tanpa Rp dan titik. Contoh: 1200000."],["4. Jawaban benar diisi satu huruf: A, B, C, atau D."],["5. Tulis nominal di teks opsi dengan format Rp diikuti angka bertitik, misalnya “Terima Rp500.000” atau “Bayar Rp1.200.000”, agar terbaca otomatis oleh dompet."],["6. Kata kunci otomatis: “lewati 1 giliran”, “gunakan asuransi”, “gunakan dana darurat”, “utang qardh”, “tidak boleh beli aset”, “1 putaran”/“2 putaran”."]];
 X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(help),"Petunjuk");
 for(const s in SH){const ws=X.utils.aoa_to_sheet([SH[s],...rows[s]]);ws["!cols"]=SH[s].map((h,i)=>({wch:i==0?28:/Opsi|Efek|Pertanyaan|Pilihan/.test(h)?48:18}));X.utils.book_append_sheet(wb,ws,s)}
 const out=X.write(wb,{bookType:"xlsx",type:"array"});await saveFile("kartu-literasi-keuangan-syariah.xlsx",new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))}
async function upXlsx(f){if(!f)return;let X;try{X=await xlsxLib()}catch(e){return tell("Pustaka Excel gagal dimuat. Periksa koneksi internet lalu coba lagi.")}
 let wb;try{wb=X.read(await f.arrayBuffer())}catch(e){return tell("File tidak bisa dibaca. Pastikan formatnya .xlsx sesuai template.")}
 const cards=[],errs=[],cnt={Positif:0,Negatif:0,Tantangan:0,Kuis:0};const find=n=>wb.SheetNames.find(s=>s.trim().toLowerCase()==n.toLowerCase());
 const S=v=>String(v==null?"":v).trim();
 for(const s in SH){const nm=find(s);if(!nm)continue;const rows=X.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:""});
  rows.slice(1).forEach((r,ix)=>{const row=ix+2;if(!r.some(x=>S(x)))return;const t=S(r[0]);if(!t){errs.push(`${s} baris ${row}: judul kosong`);return}
   if(s=="Positif"){if(!S(r[1])||!S(r[2]))return errs.push(`${s} baris ${row}: Opsi A/B kosong`);cards.push({k:"positif",t,a:S(r[1]),b:S(r[2])})}
   else if(s=="Negatif"){if(!S(r[3])||!S(r[4]))return errs.push(`${s} baris ${row}: Opsi A/B kosong`);const m=parseRp(r[1]);cards.push({k:"negatif",t,m:m?rp(m):"",s:S(r[2]),a:S(r[3]),b:S(r[4]),w:S(r[5])})}
   else if(s=="Tantangan"){const l=r.slice(1,6).map(S).filter(Boolean);if(!l.length)return errs.push(`${s} baris ${row}: belum ada efek`);cards.push({k:"tantangan",t,l})}
   else{const o=r.slice(2,6).map(S),c="ABCD".indexOf(S(r[6]).toUpperCase());if(!S(r[1])||o.some(x=>!x))return errs.push(`${s} baris ${row}: pertanyaan/pilihan belum lengkap`);if(c<0)return errs.push(`${s} baris ${row}: jawaban harus A, B, C, atau D`);cards.push({k:"quiz",t,q:S(r[1]),o,c,p:parseRp(r[7])||50000})}
   cnt[s]++})}
 if(!cards.length&&!errs.length)errs.push("Tidak ada kartu ditemukan. Pastikan nama sheet Positif, Negatif, Tantangan, dan Kuis.");
 U.up={cards,errs,cnt,name:f.name};rr()}
function applyUp(mode){const up=U.up;if(!up||!up.cards.length)return;ask(mode=="replace"?`Ganti seluruh kartu dengan ${up.cards.length} kartu dari ${up.name}? Dek akan diacak ulang dan semua nomor aktif kembali.`:`Tambahkan ${up.cards.length} kartu dari ${up.name}? Dek akan diacak ulang dan semua nomor aktif kembali.`,()=>{
 const d=mode=="replace"?up.cards:clone(D()).concat(up.cards);saveCards(d);if(G){const g=clone(G);g.ord=mkOrdFrom(d);g.used={positif:[],negatif:[],tantangan:[]};g.open=null;saveG(g)}U.up=null;toast("Kartu berhasil diunggah.")},mode=="replace"?"Ganti semua":"Tambahkan")}
function resetCards(){ask("Kembalikan semua kartu ke isi bawaan? Perubahan dari admin dan Excel akan hilang.",()=>{if(MODE=="db"){CARDS=null;wq=wq.then(()=>DB.doc("data/admin/cfg/cards").delete().catch(onErr))}else{CARDS=null;lsSave()}if(G){const g=clone(G);g.ord=mkOrdFrom(DEFAULT_CARDS);g.used={positif:[],negatif:[],tantangan:[]};g.open=null;saveG(g)}else rr()},"Kembalikan")}

function tab(k){U.tab=k;rr()}
function setAs(id){U.as=id;rr()}
function rr(){U.force=true;render()}
function render(){const a=document.activeElement;if(!U.force&&a&&a.closest&&a.closest("#app")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){U.pend=true;return}U.force=false;U.pend=false;
 const app=$("app");if(!READY){app.innerHTML=`<div class="load">Memuat permainan…</div>`;return}
 if(G)syncOpen();
 let h=header();
 if(!G)h+=noGame();
 else{h+=nav();h+=({main:mainV,tim:teamV,pasar:marketV,klasemen:boardV,riwayat:logV,admin:adminV}[U.tab]||mainV)()}
 if(G&&G.open&&U.tab=="main"&&card(G.open))h+=`<div class="ov ${CAT[G.open.k].c}"><div class="cd">${cardH()}</div></div>`;
 if(U.modal)h+=modalH();
 if(Q)h+=`<div class="ov qd"><div class="cd" role="alertdialog" aria-modal="true"><p class="qm">${esc(Q.m)}</p>${Q.f?`<div class="qb"><button onclick="qNo()">Batal</button><button class="cl" onclick="qYes()">${esc(Q.y)}</button></div>`:`<button class="cl" onclick="qYes()">Oke</button>`}</div></div>`;
 if(U.toast)h+=`<div class="toast" role="status">${esc(U.toast)}</div>`;
 app.innerHTML=h;prev();if($("bprev"))buyPrev();if($("sprev"))sellPrev();if($("rprev"))rentPrev()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(U.pend&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},0));

function header(){const me=myTeam();let role=MODE=="local"?"Mode satu perangkat":ADMIN?"Admin":me?`Pemain · ${esc(me.name)}`:"Penonton";
 let s=G?`Putaran ${G.round}${G.order.length?` · giliran <b>${esc(tName(curTid()))}</b>`:""}${G.over?" · <b>permainan selesai</b>":""}`:"";
 return`<header class="top"><div><div class="ttl">Literasi Keuangan Syariah</div><div class="mu">${s}</div></div><span class="role ${ADMIN?"adm":""}">${role}</span></header>`}
function nav(){const t=[["main","Kartu"],["tim","Tim"],["pasar","Pasar"],["klasemen","Klasemen"],["riwayat","Riwayat"]];if(ADMIN)t.push(["admin","Admin"]);return`<nav class="tabs">${t.map(([k,n])=>`<button class="${U.tab==k?"on":""}" onclick="tab('${k}')">${n}</button>`).join("")}</nav>`}
function noGame(){if(ADMIN)return`<div class="box hero"><h1>Siapkan permainan</h1><p>Buat permainan baru, lalu tambahkan tim di menu Admin. Setiap tim akan mendapat saldo awal ${rp(CFG0.start)}, Kartu Dana Darurat ${rp(CFG0.dd)}, Kartu Asuransi All Risk ${rp(CFG0.ins)}, dan fasilitas utang qardh hingga ${rp(CFG0.debtMax)}.</p><button class="wbtn" onclick="createGame()">Buat permainan</button></div>`;
 return`<div class="box hero"><h1>Menunggu admin</h1><p>Permainan belum dibuat. Halaman ini akan terbuka otomatis setelah admin menyiapkan permainan.</p></div>`}

function turnBar(){if(!G.order.length)return`<div class="warn">Belum ada tim. ${ADMIN?"Tambahkan tim di menu Admin.":"Tunggu admin menambahkan tim."}</div>`;
 const cur=curTid();return`<div class="turn"><div class="order">${G.order.map(id=>{const T=G.teams[id];return`<span class="chip ${id==cur?"on":""}">${esc(T.name)}${T.skip?` <em>lewati ${T.skip}×</em>`:""}</span>`}).join("")}</div>${canAct(cur)?`<div class="tb"><button onclick="startOpen('${cur}')">🏁 Lewat Start</button><button class="wbtn" onclick="endTurn()">Selesai giliran ${esc(tName(cur))} →</button></div>`:""}</div>`}
function mainV(){const k=U.deck,cur=curTid(),act=canAct(cur);let h=turnBar();
 const nv=`<div class="nav3 n4">`+[...Object.keys(CAT),"investasi"].map(x=>`<button class="${x=="investasi"?"wl":CAT[x].c} ${x==k?"on":""}" onclick="setDeck('${x}')">${x=="investasi"?"Investasi":CAT[x].n}</button>`).join("")+`</div>`;
 if(k=="investasi")return h+nv+investV();
 const ct=CAT[k];
 if(deckStale())return h+nv+`<div class="warn">Isi kartu berubah sejak dek terakhir disiapkan. ${ADMIN?`<button class="wbtn" onclick="rebuildDeck()">Siapkan ulang dek</button>`:"Tunggu admin menyiapkan ulang dek."}</div>`;
 const tot=G.ord[k].length,u=G.used[k];
 h+=nv;
 h+=`<div class="${ct.c}"><div class="hd"><div><h1>${ct.n}</h1><div class="mu">Sisa ${tot-u.length} dari ${tot} kartu${act&&u.length?" · ketuk nomor yang dicoret untuk mengaktifkannya kembali":""}${!act&&cur?` · menunggu giliran ${esc(tName(cur))}`:""}</div></div><button class="rnd" onclick="rnd()" ${u.length>=tot||!act?"disabled":""}>🎲 Pilih kartu secara acak</button></div>
 <div class="gr">`+Array.from({length:tot},(_,i)=>`<button class="nb ${u.includes(i+1)?"used":""}" ${act?"":"disabled"} onclick="pickN(${i+1})">${i+1}</button>`).join("")+`</div></div>`;

 h+=`<h3>Pengaturan nilai</h3><div class="box"><div class="cfg"><label>Saldo awal tim${mIn("c_start",c.start)}</label><label>Kartu Dana Darurat${mIn("c_dd",c.dd)}</label><label>Kartu Asuransi All Risk${mIn("c_ins",c.ins)}</label><label>Plafon utang qardh${mIn("c_debt",c.debtMax)}</label></div>
 <div class="tw"><table class="ct"><thead><tr><th>Aset</th><th>Harga per unit/lot</th><th>Imbal hasil / sewa</th></tr></thead><tbody>${AK.map(a=>`<tr><td>${AS[a].n}</td><td>${mIn("c_p_"+a,c.price[a])}</td><td>${mIn("c_v_"+a,INC.includes(a)?c.inc[a]:c.rent[a])}<div class="mu sm">${hint[a]}</div></td></tr>`).join("")}</tbody></table></div><p class="mu sm">Saldo awal, Dana Darurat, dan Asuransi berlaku untuk tim baru dan permainan baru. Harga, imbal hasil, dan sewa langsung berlaku.</p><button class="wbtn" onclick="saveCfg()">Simpan pengaturan</button></div>`;
 h+=cardAdmin();return h}
function cardAdmin(){const d=D(),k=U.ce,list=d.map((c,i)=>({c,i})).filter(x=>GK(x.c)==k);let h=`<h3>Kartu, soal, dan tantangan</h3><div class="box">
 <div class="frm"><button onclick="dlXlsx()">⬇ Unduh template Excel (berisi kartu saat ini)</button><label class="filebtn">⬆ Unggah Excel<input type="file" accept=".xlsx,.xls" onchange="upXlsx(this.files[0]);this.value=''"></label>${CARDS?`<button onclick="resetCards()">Kembalikan kartu bawaan</button>`:""}</div>`;
 if(U.up){const u=U.up;h+=`<div class="upbox"><b>${esc(u.name)}</b><div class="mu">Terbaca ${u.cards.length} kartu: ${Object.entries(u.cnt).map(([a,b])=>`${a} ${b}`).join(", ")}</div>${u.errs.length?`<div class="err">${u.errs.length} baris dilewati:<ul>${u.errs.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}<div class="frm">${u.cards.length?`<button class="wbtn" onclick="applyUp('replace')">Ganti semua kartu</button><button onclick="applyUp('append')">Tambahkan ke kartu yang ada</button>`:""}<button onclick="U.up=null;rr()">Batal</button></div></div>`}
 h+=`<div class="nav3 sm">${Object.keys(CAT).map(x=>`<button class="${CAT[x].c} ${x==k?"on":""}" onclick="ceTab('${x}')">${CAT[x].n} (${d.filter(c=>GK(c)==x).length})</button>`).join("")}</div>
 <div class="clist">${list.map(({c,i})=>`<div class="citem"><div><b>${esc(c.t)}</b><div class="mu sm">${esc(c.k=="quiz"?"Kuis · "+c.q:c.k=="tantangan"?c.l.join(" · "):(c.m?c.m+" · ":"")+"A: "+c.a)}</div></div><div class="ord"><button onclick="editCard(${i})">Edit</button><button onclick="delCard(${i})">Hapus</button></div></div>`).join("")}</div>
 <button class="wbtn" onclick="editCard(-1)">+ Tambah kartu ${k=="tantangan"?"tantangan atau kuis":CAT[k].n.toLowerCase()}</button></div>`;return h}

function modalH(){const m=U.modal;let h="",cls="wl";
 if(m.type=="buy"){const T=G.teams[m.tid];h=`<h2>Beli aset · ${esc(T.name)}</h2><div class="pick">${AK.map(a=>`<button class="${a==m.a?"on":""}" onclick="setBuyA('${a}')">${AS[a].n}</button>`).join("")}</div><p class="mu">Harga ${rp(G.cfg.price[m.a])} per ${AS[m.a].u} · tersedia ${G.stock[m.a]} ${AS[m.a].u} · kas tim ${rp(T.cash)}</p><div class="fr"><label for="b_q">Jumlah (${AS[m.a].u})</label>${qIn("b_q",1,"buyPrev()")}</div><div class="fr"><label for="b_d">Potongan harga dari kartu</label>${mIn("b_d",0,{on:"buyPrev()"})}<div class="mu">Isi jika ada kartu diskon, misalnya Subsidi Investasi Syariah.</div></div><div class="prev" id="bprev"></div><button class="cl" id="bgo" onclick="doBuy()">Beli</button>`}
 else if(m.type=="sell"){const T=G.teams[m.tid],own=AK.filter(a=>T.assets[a].q>0);h=`<h2>Jual aset · ${esc(T.name)}</h2><div class="pick">${own.map(a=>`<button class="${a==m.a?"on":""}" onclick="setSellA('${a}')">${AS[a].n} (${T.assets[a].q})</button>`).join("")}</div><div class="fr"><label for="s_q">Jumlah (${AS[m.a].u})</label>${qIn("s_q",1,"sellPrev()")}</div><div class="fr"><span>Penyesuaian harga dari kartu</span><div class="adj">${[-30,-20,-15,0,10].map(v=>`<button data-v="${v}" class="${(m.adj||0)==v?"on":""}" onclick="setAdj(${v})">${v?pc(v):"Normal"}</button>`).join("")}</div></div><div class="prev" id="sprev"></div><button class="cl" id="sgo" onclick="doSell()">Jual ke Bank</button>`}
 else if(m.type=="debt"){const T=G.teams[m.tid];h=m.mode=="take"?`<h2>Ambil utang qardh · ${esc(T.name)}</h2><p>Pinjaman tanpa bunga hingga <b>${rp(G.cfg.debtMax)}</b>, hanya bisa diambil sekali. Utang yang belum lunas saat permainan berakhir akan mengurangi nilai akhir tim.</p><div class="fr"><label for="d_a">Nominal pinjaman</label>${mIn("d_a",G.cfg.debtMax)}</div><button class="cl" onclick="debtGo()">Ambil utang</button>`:`<h2>Lunasi utang · ${esc(T.name)}</h2><p>Sisa utang <b>${rp(T.debt.out)}</b> · kas tim ${rp(T.cash)}</p><div class="fr"><label for="d_a">Nominal pelunasan</label>${mIn("d_a",Math.min(T.debt.out,Math.max(0,T.cash)))}</div><button class="cl" onclick="debtGo()">Bayar</button>`}
 else if(m.type=="start"){const T=G.teams[m.tid],rows=startRows(),hasS=T.assets.saham.q>0;
  h=`<h2>🏁 ${esc(T.name)} melewati Start</h2><p class="mu">Ini akan menjadi tahun ke-${T.years+1} bagi tim.</p>`;
  if(hasS)h+=`<div class="scbox"><div class="hd"><b>Skenario saham (diacak)</b>${ADMIN?`<button onclick="rndSc()">🎲 Acak ulang</button>`:""}</div>${m.sc!=null?`<div class="scres ${SC[m.sc].s>0?"up":"dn"}"><b>${SC[m.sc].n} · ${sg(SC[m.sc].s*G.cfg.inc.saham)} / lot</b><div class="mu">${SC[m.sc].d}</div></div>`:""}${ADMIN?`<details><summary class="mu">atau pilih skenario sendiri (admin)</summary><div class="sclist">${SC.map((x,i)=>`<button class="${m.sc==i?"on":""}" onclick="pickSc(${i})">${x.n} <span class="${x.s>0?"up":"dn"}">${sg(x.s*G.cfg.inc.saham)}</span></button>`).join("")}</div></details>`:""}</div>`;
  h+=rows.length?`<div class="tw"><table><thead><tr><th>Aset</th><th>Jumlah</th><th>Per unit</th><th>Total</th><th>Masuk ke</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${AS[r.a].n}${r.x&&r.x.note?`<div class="mu sm">${r.x.note}</div>`:""}</td><td>${r.h.q} ${AS[r.a].u}</td><td>${r.x?sg(r.x.per):"?"}</td><td class="${r.tot>0?"up":r.tot<0?"dn":""}">${r.x?sg(r.tot):"–"}</td><td>${r.cash?"Kas (kupon)":"Nilai aset"}</td></tr>`).join("")}</tbody></table></div>`:`<p>Tim belum memiliki investasi (Sukuk, Saham, Reksa Dana), jadi tidak ada perubahan. Properti menghasilkan sewa saat diinjak pemain lain.</p>`;
  h+=`<button class="cl" onclick="doStart()">Catat tahun ke-${T.years+1}</button>`}
 else if(m.type=="rent"){const T=G.teams[m.tid],own=rentOwners(m);
  h=`<h2>Bayar sewa · ${esc(T.name)}</h2><p class="mu">${esc(T.name)} menginjak kotak properti milik tim lain. Kas tim ${rp(T.cash)}.</p><div class="pick">${PROP.map(a=>`<button class="${a==m.a?"on":""}" onclick="setRentA('${a}')">${AS[a].n}</button>`).join("")}</div><div class="fr"><label for="r_o">Pemilik properti</label><select id="r_o" onchange="setRentO(this.value)">${own.length?own.map(t=>`<option value="${t.id}" ${m.owner==t.id?"selected":""}>${esc(t.name)} (${t.assets[m.a].q} ${AS[m.a].u})</option>`).join(""):`<option value="">Belum ada pemilik</option>`}</select></div><div class="fr"><label for="r_q">Jumlah unit disewa</label>${qIn("r_q",1,"rentPrev()")}<div class="mu">Sewa ${rp(G.cfg.rent[m.a])} per ${AS[m.a].u}.</div></div><div class="prev" id="rprev"></div><button class="cl" id="rgo" onclick="doRent()">Bayar sewa</button>`}
 else if(m.type=="manual"){const opts=G.order.map(id=>`<option value="${id}">${esc(tName(id))}</option>`).join("");h=`<h2>Transaksi manual</h2><p class="mu">Untuk hal di luar kartu, seperti sewa properti, gaji, atau koreksi.</p><div class="fr"><label for="mt">Tim</label><select id="mt">${opts}</select></div><div class="fr"><label for="ma">Nominal</label>${mIn("ma",0,{signed:1})}<div class="mu">+ berarti tim menerima, − berarti tim membayar.</div></div><div class="fr"><label for="mc">Lawan transaksi</label><select id="mc"><option value="">Bank</option>${opts}</select></div><div class="fr"><label for="mn">Keterangan</label><input id="mn" placeholder="Misal: sewa apartemen"></div><button class="cl" onclick="manualGo()">Catat</button>`}
 else if(m.type=="card"){const c=m.i>=0?D()[m.i]:null,kind=c?c.k:(m.k=="tantangan"?(m.kind||"tantangan"):m.k);cls=CAT[GK({k:kind})].c;
  h=`<h2>${c?"Edit kartu":"Kartu baru"}</h2>${!c&&m.k=="tantangan"?`<label>Jenis<select id="e_kind" onchange="U.modal.kind=this.value;rr()"><option value="tantangan" ${kind=="tantangan"?"selected":""}>Tantangan (daftar efek)</option><option value="quiz" ${kind=="quiz"?"selected":""}>Kuis pilihan ganda</option></select></label>`:""}<div class="form">${cardForm(c,kind)}</div><button class="cl" onclick="saveCard()">Simpan kartu</button>`}
 return`<div class="ov ${cls}"><div class="cd">${h}<button class="ghost" onclick="closeModal()">Batal</button></div></div>`}

render();boot();

</script></body></html>
